<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ShopBot AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #667eea;
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-color: #f5f7fb;
            --text-color: #333;
            --border-color: #ddd;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        header {
            background: var(--primary-gradient);
            color: white;
            padding: 20px 40px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            font-weight: 500;
            color: #666;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .tab-content {
            display: none;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .tab-content.active {
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            text-align: left;
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f9f9f9;
            font-weight: 600;
        }

        tr:nth-child(even) {
            background-color: #fafafa;
        }

        tr:hover {
            background-color: #f0f4ff;
        }

        .conf-high { color: #2e7d32; font-weight: 500; }
        .conf-med { color: #f57c00; font-weight: 500; }
        .conf-low { color: #c62828; font-weight: 500; }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        input[type="text"], input[type="date"], select {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: inherit;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
        }

        button:hover {
            opacity: 0.9;
        }
        
        .btn-delete {
            background: #d32f2f;
        }

        .btn-edit {
            background: #1976d2;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            text-align: center;
            border-top: 4px solid var(--primary);
        }

        .stat-card h3 {
            margin: 0 0 10px 0;
            font-size: 1rem;
            color: #666;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 600;
            color: var(--primary);
            margin: 0;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
        }

        .modal-content h2 { margin-top: 0; }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-cancel {
            background: #e0e0e0;
            color: #333;
        }
    </style>
</head>
<body>

<header>
    <h1>Admin Dashboard</h1>
</header>

<div class="container">
    <div class="tabs">
        <div class="tab active" onclick="switchTab('logs')">Conversation Logs</div>
        <div class="tab" onclick="switchTab('faq')">FAQ Management</div>
        <div class="tab" onclick="switchTab('stats')">Statistics</div>
    </div>

    <!-- Logs Tab -->
    <div id="logs" class="tab-content active">
        <div class="controls">
            <input type="text" id="logSearch" placeholder="Search Session ID...">
            <input type="date" id="logDate">
            <label>
                <input type="checkbox" id="lowConfOnly"> Show only low confidence (< 0.5)
            </label>
            <button onclick="fetchLogs()">Refresh Logs</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Session ID</th>
                    <th>User Message</th>
                    <th>Bot Response</th>
                    <th>Confidence</th>
                    <th>Feedback</th>
                </tr>
            </thead>
            <tbody id="logsTableBody">
                <!-- Populated by JS -->
                <tr><td colspan="6" style="text-align: center;">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- FAQ Tab -->
    <div id="faq" class="tab-content">
        <div class="controls">
            <button onclick="openFaqModal()">Add New FAQ</button>
            <button onclick="fetchFaqs()" style="background: #e0e0e0; color: #333;">Refresh</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Category</th>
                    <th>Question</th>
                    <th>Answer</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="faqTableBody">
                <!-- Populated by JS -->
                <tr><td colspan="5" style="text-align: center;">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Stats Tab -->
    <div id="stats" class="tab-content">
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Conversations</h3>
                <p class="value" id="statTotalConv">0</p>
            </div>
            <div class="stat-card">
                <h3>Average Confidence</h3>
                <p class="value" id="statAvgConf">0.00</p>
            </div>
            <div class="stat-card">
                <h3>Unanswered Queries</h3>
                <p class="value" id="statUnanswered">0</p>
            </div>
        </div>

        <h3>Top 5 FAQs</h3>
        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Question</th>
                    <th>Count</th>
                </tr>
            </thead>
            <tbody id="topFaqBody">
                <!-- Populated by JS -->
            </tbody>
        </table>
        <button onclick="fetchStats()" style="margin-top: 15px;">Refresh Stats</button>
    </div>
</div>

<!-- FAQ Modal -->
<div id="faqModal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle">Add New FAQ</h2>
        <input type="hidden" id="faqId">
        <div class="form-group">
            <label>Category</label>
            <input type="text" id="faqCategory" placeholder="e.g. Shipping">
        </div>
        <div class="form-group">
            <label>Question</label>
            <input type="text" id="faqQuestion" placeholder="The user's question">
        </div>
        <div class="form-group">
            <label>Answer</label>
            <textarea id="faqAnswer" rows="4" placeholder="The bot's response"></textarea>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            <button onclick="saveFaq()">Save</button>
        </div>
    </div>
</div>

<script>
    function switchTab(tabId) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        
        event.target.classList.add('active');
        document.getElementById(tabId).classList.add('active');

        if (tabId === 'logs') fetchLogs();
        if (tabId === 'faq') fetchFaqs();
        if (tabId === 'stats') fetchStats();
    }

    function getConfidenceClass(conf) {
        if (conf >= 0.8) return 'conf-high';
        if (conf >= 0.5) return 'conf-med';
        return 'conf-low';
    }

    function escapeHTML(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    async function fetchLogs() {
        const tbody = document.getElementById('logsTableBody');
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">Loading...</td></tr>';
        
        try {
            // In a real app, query parameters would be appended based on controls
            const response = await fetch('/api/logs');
            const logs = await response.json();
            
            const search = document.getElementById('logSearch').value.toLowerCase();
            const lowConf = document.getElementById('lowConfOnly').checked;

            tbody.innerHTML = '';
            
            logs.forEach(log => {
                if (search && !log.session_id.toLowerCase().includes(search)) return;
                if (lowConf && log.confidence_score >= 0.65) return;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${escapeHTML(new Date(log.timestamp).toLocaleString())}</td>
                    <td title="${escapeHTML(log.session_id)}">${escapeHTML(log.session_id.substring(0, 8))}...</td>
                    <td>${escapeHTML(log.user_message)}</td>
                    <td>${escapeHTML(log.bot_response.substring(0, 50))}${log.bot_response.length > 50 ? '...' : ''}</td>
                    <td class="${getConfidenceClass(log.confidence_score)}">${log.confidence_score.toFixed(2)}</td>
                    <td>${escapeHTML(log.feedback) || '-'}</td>
                `;
                tbody.appendChild(tr);
            });

            if (tbody.innerHTML === '') {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No logs found.</td></tr>';
            }
        } catch (error) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: red;">Error loading logs.</td></tr>';
        }
    }

    async function fetchFaqs() {
        const tbody = document.getElementById('faqTableBody');
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Loading...</td></tr>';
        
        try {
            const response = await fetch('/api/faq');
            const faqs = await response.json();
            
            tbody.innerHTML = '';
            
            faqs.forEach(faq => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${faq.id}</td>
                    <td>${escapeHTML(faq.category)}</td>
                    <td>${escapeHTML(faq.question)}</td>
                    <td>${escapeHTML(faq.answer.substring(0, 50))}${faq.answer.length > 50 ? '...' : ''}</td>
                    <td>
                        <button class="btn-edit" onclick='openFaqModal(${JSON.stringify(faq).replace(/'/g, "&#39;")})'> Edit</button>
                        <button class="btn-delete" onclick="deleteFaq(${faq.id})">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: red;">Error loading FAQs.</td></tr>';
        }
    }

    async function fetchStats() {
        try {
            const response = await fetch('/api/logs/stats');
            const stats = await response.json();
            
            document.getElementById('statTotalConv').innerText = stats.total_conversations;
            document.getElementById('statAvgConf').innerText = stats.avg_confidence.toFixed(2);
            document.getElementById('statUnanswered').innerText = stats.unanswered_count;

            const tbody = document.getElementById('topFaqBody');
            tbody.innerHTML = '';
            stats.top_faqs.forEach((faq, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${faq.question}</td>
                    <td>${faq.count}</td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            console.error('Error fetching stats:', error);
        }
    }

    // Modal Logic
    const modal = document.getElementById('faqModal');

    function openFaqModal(faq = null) {
        document.getElementById('modalTitle').innerText = faq ? 'Edit FAQ' : 'Add New FAQ';
        document.getElementById('faqId').value = faq ? faq.id : '';
        document.getElementById('faqCategory').value = faq ? faq.category : '';
        document.getElementById('faqQuestion').value = faq ? faq.question : '';
        document.getElementById('faqAnswer').value = faq ? faq.answer : '';
        modal.style.display = 'flex';
    }

    function closeModal() {
        modal.style.display = 'none';
    }

    async function saveFaq() {
        const id = document.getElementById('faqId').value;
        const payload = {
            category: document.getElementById('faqCategory').value,
            question: document.getElementById('faqQuestion').value,
            answer: document.getElementById('faqAnswer').value
        };

        const method = id ? 'PUT' : 'POST';
        const url = id ? `/api/faq/${id}` : '/api/faq';

        try {
            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                closeModal();
                fetchFaqs();
            } else {
                alert('Error saving FAQ');
            }
        } catch (error) {
            console.error('Save error:', error);
            alert('Error saving FAQ');
        }
    }

    async function deleteFaq(id) {
        if (!confirm('Are you sure you want to delete this FAQ?')) return;

        try {
            const response = await fetch(`/api/faq/${id}`, { method: 'DELETE' });
            if (response.ok) {
                fetchFaqs();
            } else {
                alert('Error deleting FAQ');
            }
        } catch (error) {
            console.error('Delete error:', error);
        }
    }

    // Initial load
    fetchLogs();
</script>

</body>
</html>
